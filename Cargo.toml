[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A native Windows radial window manager"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry",
  "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Controls",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_System_Com_StructuredStorage"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
