[package]
name = "orbit-gift"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Orbit native offline gift installer"
build = "build.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
  "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_LibraryLoader",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_Security"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
