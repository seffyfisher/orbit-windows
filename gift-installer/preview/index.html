<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit · מתנה מספי · תצוגה</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8edf7;color:#111827;font-family:"Segoe UI",Arial,sans-serif}main{min-height:100svh;display:grid;place-content:center;gap:16px;padding:28px 16px}.window{width:min(960px,calc(100vw - 32px));background:#faf9f8;border:1px solid #cbd4e4;border-radius:12px;overflow:hidden;box-shadow:0 16px 38px #1c293325}.titlebar{height:44px;background:#eff3fa;border-bottom:1px solid #dbe2ec;padding:0 20px;display:flex;align-items:center;justify-content:space-between;direction:ltr}.brand{font-size:23px;letter-spacing:-.4px;font-weight:900;display:inline-flex;align-items:center;gap:0;color:#111827}.brand span{color:#164efa}.chrome{font-size:22px;word-spacing:22px;color:#46505d}.content{text-align:center;padding:28px 20px 13px}h1{margin:0;font-size:clamp(25px,4vw,40px);line-height:1.5;font-weight:800;letter-spacing:-.8px}.subtitle{margin:8px 0 0;color:#526176;font-size:clamp(16px,2.3vw,21px);line-height:1.5;min-height:32px}.parcel{width:45.65%;aspect-ratio:2;position:relative;margin:4px auto 0;cursor:grab;touch-action:none;user-select:none;border-radius:8px}.parcel.dragging{cursor:grabbing}.parcel.opened{cursor:default}canvas{display:block;width:100%;height:100%;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#526176}.choices{display:flex;gap:32px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:32px;margin:3px 0 14px;font-size:17px}.choices label{display:flex;gap:8px;align-items:center;cursor:pointer}input{width:18px;height:18px;accent-color:#164efa}.choices[hidden]{display:flex;visibility:hidden}.actions{min-height:43px}.action{font:600 19px "Segoe UI",Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;min-width:168px;max-width:100%;min-height:43px;padding:6px 20px;color:#fff;background:#164efa;border:1px solid #164efa;border-radius:7px;text-decoration:none;cursor:pointer}.action:hover{background:#103bd0}.action:disabled{background:#929bab;border-color:#929bab;cursor:wait}.action.secondary{font-size:13px;font-weight:400;background:transparent;color:#526176;border-color:#b8c4d8}.action.secondary:hover{background:#eff3fa}.disclosure{margin:17px 2px 0;color:#526176;font-size:13px;line-height:1.6;min-height:22px}.note{font-size:13px;color:#526176;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.note button{background:none;border:0;text-decoration:underline;text-underline-offset:3px;color:#111827;font:inherit;cursor:pointer}:focus-visible{outline:2px solid #164efa;outline-offset:4px}[hidden]:not(.choices){display:none!important}@media(max-width:600px){main{padding:12px 8px}.window{width:calc(100vw - 16px)}.content{padding:22px 8px 13px}.titlebar{height:38px;padding:0 12px}.parcel{width:50%;margin-top:12px}.choices{gap:10px;font-size:14px;min-height:58px;margin-bottom:10px}.disclosure{font-size:11px}.chrome{word-spacing:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main>
 <section class="window" aria-label="תצוגה של מתקין המתנה של Orbit">
  <header class="titlebar"><span class="brand" dir="ltr"><span>O</span>rbit</span><span class="chrome" aria-hidden="true">− □ ×</span></header>
  <div class="content">
   <h1 id="headline">כל החלונות. כל הבלגן.</h1>
   <p class="subtitle" id="subtitle" aria-live="polite">משוך את הנייר מימין לשמאל כדי לעשות קצת סדר</p>
   <div class="parcel" id="parcel" tabindex="0" role="button" aria-label="פתח את המתנה בגרירה מימין לשמאל, או עם Enter. תצוגה בלבד.">
    <canvas width="840" height="420" aria-hidden="true"></canvas><div class="loading">מכינים את המתנה…</div>
   </div>
   <div class="choices" hidden>
    <label><input id="desktop" type="checkbox">קיצור על שולחן העבודה</label>
    <label><input id="startup" type="checkbox">הפעלה עם כניסה ל־Windows</label>
   </div>
   <div class="actions"><button class="action secondary" id="action">או אפשר גם להתקין בלי להרוס את עטיפת המתנה</button><a class="action" id="download" href="../../../Orbit-Gift-0.1.0-x64.exe" download hidden>הורדת המתנה ל־Windows</a></div>
   <p class="disclosure" id="disclosure">מספי · פותחים, בוחרים ומתקינים · גרסת ניסיון לא חתומה</p>
  </div>
 </section>
 <aside class="note"><span>תצוגה בלבד · ההתקנה כאן מדומה ולא משנה דבר במחשב</span><button id="reset">לעטוף מחדש</button></aside>
</main>
<script>
'use strict';
const W=840,H=420,$=id=>document.getElementById(id),parcel=$('parcel'),canvas=document.querySelector('canvas'),action=$('action'),download=$('download'),choices=document.querySelector('.choices');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let progress=0,phase='wrapped',drag=null,animation=0,simulation=0,images=null;
function polygon(p){if(p<=0)return[];const left=Math.max(-.05,1-p*1.14),radius=.02+.34*p+Math.max(0,p-.72)*2.7,edge=(i,lower)=>{const x=left+(1.06-left)*i/90,jag=(((i*17+3)%13)/13-.5)*.008,spread=radius*Math.sqrt((x-left)/(1.06-left));return[x*W,(.82-x*.62+jag+(lower?spread:-spread))*H]};return[...Array.from({length:91},(_,i)=>edge(i,false)),...Array.from({length:91},(_,i)=>edge(90-i,true))]}
function draw(){if(!images)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const[paper,product,flap,dedication]=images;ctx.drawImage(product,8,5,W-16,H-8);ctx.drawImage(dedication,W*.58,H*.48,270,180);if(progress>=1)return;const layer=document.createElement('canvas');layer.width=canvas.width;layer.height=canvas.height;const p=layer.getContext('2d');p.scale(dpr,dpr);p.drawImage(paper,0,0,W,H);const points=polygon(progress);if(points.length){p.globalCompositeOperation='destination-out';p.beginPath();points.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath();p.fill()}ctx.drawImage(layer,0,0,W,H);if(points.length){ctx.save();ctx.beginPath();ctx.rect(18,H*.165,W-36,H*.78);ctx.clip();ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.strokeStyle='#eeeeec';ctx.lineWidth=2.2;ctx.stroke();ctx.restore()}if(progress<.85){ctx.save();ctx.translate(Math.max(.07,1-progress*1.14)*W,(.82-(1-progress*1.14)*.62)*H);ctx.rotate((-25+progress*35)*Math.PI/180);const w=progress<.02?145:185+120*progress;ctx.drawImage(flap,-w*.6,-w*.32,w,w*.5);ctx.restore()}}
function cancel(){drag=null;parcel.classList.remove('dragging')}
function update(){const copy={wrapped:['כל החלונות. כל הבלגן.','משוך את הנייר מימין לשמאל כדי לעשות קצת סדר','או אפשר גם להתקין בלי להרוס את עטיפת המתנה','מספי · פותחים, בוחרים ומתקינים · גרסת ניסיון לא חתומה'],configure:['קצת יותר סדר. קצת פחות גרירות.','Orbit מסדר חלונות בתנועה אחת. נתקין?','התקנה לדוגמה','במתקין Windows: התקנה למשתמש הנוכחי, ללא הרשאות מנהל או הורדות נוספות'],installing:['עוד רגע, והיא שלך','כך ייראה שלב ההתקנה במחשב Windows…','מתקינים לדוגמה…','זו הדמיה בלבד. שום תוכנה לא מותקנת כעת.'],ready:['המתנה שלך מוכנה','מחזיקים Ctrl ימני, מזיזים לכיוון הרצוי ומשחררים.','','אפשר גם Win + Alt + Space · תתחדש. באהבה, מספי']}[phase];$('headline').textContent=copy[0];$('subtitle').textContent=copy[1];action.textContent=copy[2];$('disclosure').textContent=copy[3];choices.hidden=phase!=='configure';action.hidden=phase==='ready';download.hidden=phase!=='ready';action.disabled=phase==='installing'||!images;action.classList.toggle('secondary',phase==='wrapped');parcel.classList.toggle('opened',phase!=='wrapped');parcel.tabIndex=phase==='wrapped'?0:-1;parcel.setAttribute('aria-disabled',String(phase!=='wrapped'||!images));}
function reveal(instant=false){if(phase!=='wrapped')return;cancel();cancelAnimationFrame(animation);const complete=()=>{progress=1;phase='configure';draw();update();$('desktop').focus({preventScroll:true})};if(instant||reduced.matches){complete();return}phase='opening';action.disabled=true;const from=progress,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/250);progress=from+(1-from)*(1-(1-t)**3);draw();if(t<1)animation=requestAnimationFrame(frame);else complete()}animation=requestAnimationFrame(frame)}
parcel.addEventListener('pointerdown',e=>{if(!images||phase!=='wrapped'||e.button!==0)return;const scale=W/parcel.getBoundingClientRect().width;drag={x:e.clientX,y:e.clientY,from:progress,scale,pointer:e.pointerId};parcel.setPointerCapture(e.pointerId);parcel.classList.add('dragging');parcel.focus({preventScroll:true})});
parcel.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;progress=Math.max(progress,Math.min(1,Math.max(0,drag.from+((drag.x-e.clientX)*.85+(e.clientY-drag.y)*.5)*drag.scale/(W*.7))));draw()});
parcel.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;const complete=progress>=.94;cancel();if(parcel.hasPointerCapture(e.pointerId))parcel.releasePointerCapture(e.pointerId);if(complete)reveal()});
for(const event of ['pointercancel','lostpointercapture'])parcel.addEventListener(event,cancel);window.addEventListener('blur',cancel);
parcel.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&phase==='wrapped'){e.preventDefault();reveal(true)}if(e.key==='Escape')cancel()});
action.addEventListener('click',()=>{if(phase==='wrapped')reveal(true);else if(phase==='configure'){phase='installing';update();simulation=setTimeout(()=>{phase='ready';update();download.focus({preventScroll:true})},new URLSearchParams(location.search).has('video')?6000:650)}});
$('reset').addEventListener('click',()=>{cancel();cancelAnimationFrame(animation);clearTimeout(simulation);progress=0;phase='wrapped';$('desktop').checked=$('startup').checked=false;draw();update();action.focus({preventScroll:true})});
const load=url=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=url});
Promise.all(['wrapped-parcel.png','product-box.png','paper-flap.png','dedication.png'].map(name=>load('../assets/'+name))).then(result=>{images=result;document.querySelector('.loading').hidden=true;draw();update()}).catch(()=>{document.querySelector('.loading').textContent='לא ניתן לטעון את המתנה. יש לפתוח מתוך החבילה המלאה.';action.disabled=true});update();
</script>
</html>
